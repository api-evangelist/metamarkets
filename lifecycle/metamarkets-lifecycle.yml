note: >-
  Lifecycle posture of the Metamarkets Real-Time Data Ingestion (RDI) API,
  recorded from the surviving legacy documentation and live probes. Metamarkets
  was acquired by Snap Inc. in 2017; the corporate site (metamarkets.com) now
  returns HTTP 404 and the only live surface is the ReadMe-hosted legacy docs at
  docs.metamarkets.com. No deprecation policy, no SLA and no changelog are
  published, and the Statuspage host survives only as a deactivated shell. Each
  absence was probed, and no StatusPage, Deprecation or ChangeLog pointer is
  emitted for this provider as a result.
versioning:
  api_scheme: none
  note: >-
    The ingestion endpoint carries no version in its path or headers
    (https://<host>/events/<endpoint-name>). What is versioned is the PAYLOAD
    contract (OpenRTB API Specification Version 2.5, per the Official Standards
    list) and the first-party client library.
  payload_standard: OpenRTB 2.5
  client_library:
    name: RdiClient for Java
    current: '0.13'
    maturity: beta
    quote: >-
      "The RdiClient for Java is currently in beta and the current version is 0.13."
    docs: https://docs.metamarkets.com/docs/rdi-client-library
