note: >-
  Metamarkets shipped a first-party Java client library ("RdiClient for Java") for
  posting event streams to the Real-Time Data Ingestion (RDI) API. Artifacts were
  hosted on the Metamarkets Artifactory Maven repository — NOT Maven Central — with
  source on the metamx GitHub org. CURRENCY FINDING (probed 2026-08-12): the
  Artifactory server is gone. https://metamx.artifactoryonline.com/... returns HTTP
  403 for the repository root, the artifact directories and the distribution tar,
  and the successor host metamx.jfrog.io 302s to
  https://landing.jfrog.com/reactivate-server/metamx — i.e. the JFrog instance is
  deactivated. None of these coordinates are installable today. Maven Central
  carries 22 com.metamx artifacts (java-util, emitter, scala-util, tranquility...)
  but NONE of the RDI ones, so there is no mirror. Because no registry answers,
  `version` is taken from the versions the docs name and `published` from the
  matching annotated tag in the public GitHub source repo — the only dated,
  first-party evidence that survives. The library is documented as beta and its last
  release predates the 2017 Snap Inc. acquisition by roughly a year.
