apis:
- name: Metamarkets Real-Time Data Ingestion (RDI) API
  description: >-
    HTTPS event-ingestion API for streaming batches of newline-delimited JSON,
    OpenRTB 2.5-based ad-tech event records (e.g. MmxAuctionSummary) to the
    Metamarkets platform for near-real-time dashboarding. Authenticated with HTTP
    Basic; gzip supported; quota-signaled with HTTP 420.
  humanURL: https://docs.metamarkets.com/docs/real-time-data-delivery
  baseURL: https://rt-evaluate.metamarkets.com/events/
  x-baseURL-note: Documented evaluation ingestion host; production endpoints are issued per customer by a Metamarkets data engineer.
