aid: metamarkets
name: Metamarkets
description: >-
  Metamarkets built a real-time analytics platform for the programmatic
  advertising industry, giving ad exchanges, DSPs, SSPs, and publishers an
  interactive dashboard over billions of daily bid, impression, and spend events.
  Its Real-Time Data Ingestion (RDI) platform ingests well-formatted,
  standards-based ad-tech event data (adhering to OpenRTB 2.5, IAB guidelines,
  and ISO date/country/language/currency standards) over an authenticated HTTPS
  streaming endpoint and surfaces it in the Metamarkets dashboard within seconds
  for querying and analysis. Metamarkets was acquired by Snap Inc. in 2017; the
  primary metamarkets.com site is now defunct, but the legacy developer
  documentation for the RDI platform remains live at docs.metamarkets.com.
  Surfaced as a portfolio company of Anthemis and profiled in the API Evangelist
  network.
