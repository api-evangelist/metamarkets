note: >-
  Metamarkets published NO pricing page and NO plan tiers. Pricing was negotiated
  per customer. The provider states it plainly in its own FAQ ("How am I charged
  for these services?"): "Our pricing models are based on the structure of the
  data being ingested, how closely it complies with standards, and how many events
  are uploaded. Metamarkets works with clients to determine their requirements for
  volume and nonstandard content to determine fair pricing for each use case." The
  billable unit is defined ("An event equals one of those records") but no rate is
  published. The former marketing site that would have carried any pricing page is
  gone — metamarkets.com returns HTTP 404 following the 2017 Snap Inc. acquisition.
  plan_count: 0 is a recorded fact, not a gap in the pass.
